[package]
name = "diatypst"
version = "0.9.2"
entrypoint = "lib.typ"
authors = ["skriptum (https://github.com/skriptum)"]
license = "MIT-0"
display-name = "Diatypst"
description = "Beamer-inspired slide decks with dot counters, themed layouts, and more."
repository = "https://github.com/skriptum/Diatypst"
keywords = ["slides", "presentation", "beamer"]
categories = ["presentation"]
compiler = "0.12.0"
exclude = ["screenshots", "example", "diaquarto"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "Thumbnail.png"
