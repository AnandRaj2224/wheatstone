[buildPlans.TypesetterSlab]
family = "Typesetter Slab"
spacing = "normal"
serifs = "slab"
noCvSs = true
exportGlyphNames = false
buildTextureFeature = true

  [buildPlans.TypesetterSlab.variants]
  inherits = "ss05"

    [buildPlans.TypesetterSlab.variants.design]
    capital-k = "curly-full-serifed"
    g = "double-storey"
    k = "curly-full-serifed"
    at = "fourfold"

  [buildPlans.TypesetterSlab.ligations]
  enables = ["eqeq", "kern-bars", "kern-dotty", "minus-minus", "slash-asterisk"]

[buildPlans.TypesetterSlab.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.TypesetterSlab.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.TypesetterSlab.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.TypesetterSlab.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.TypesetterSlab.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

# Enable variable font output
[buildPlans.TypesetterSlab.variantGroups]
enabled = true